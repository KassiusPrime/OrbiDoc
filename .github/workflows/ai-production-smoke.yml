name: OrbiDoc Production AI Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'qa/ai-production-smoke-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate production AI end to end
        env:
          BASE_URL: https://doc-swiss.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;

          async function jsonRequest(path, init = {}) {
            const response = await fetch(`${base}${path}`, init);
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`${path} returned non-JSON HTTP ${response.status}: ${text.slice(0, 200)}`); }
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}: ${JSON.stringify(data).slice(0, 400)}`);
            return data;
          }

          const health = await jsonRequest('/api/health');
          if (health?.gatewayAuth !== 'oidc' || health?.ai?.gateway !== true) {
            throw new Error(`OIDC health failed: ${JSON.stringify(health)}`);
          }
          console.log('health: OIDC + Gateway OK');

          const status = await jsonRequest('/api/ai/status');
          const gateway = status?.providers?.gateway;
          if (!gateway?.configured || !gateway?.reachable || gateway?.status !== 200) {
            throw new Error(`Gateway probe failed: ${JSON.stringify(gateway)}`);
          }
          console.log('gateway probe: HTTP 200');

          const chat = await jsonRequest('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: 'gateway',
              model: 'google/gemini-3.6-flash',
              messages: [{ role: 'user', content: 'Responda somente com ORBIDOC_TEXT_OK.' }],
            }),
          });
          if (chat?.provider !== 'gateway' || typeof chat?.answer !== 'string' || !chat.answer.trim()) {
            throw new Error(`Text generation failed: ${JSON.stringify({ provider: chat?.provider, model: chat?.model, fallbackUsed: chat?.fallbackUsed })}`);
          }
          console.log(`text: provider=${chat.provider} model=${chat.model} routed=${chat.routedModel || 'n/a'} fallback=${Boolean(chat.fallbackUsed)}`);

          const streamResponse = await fetch(`${base}/api/chat/stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: 'gateway',
              model: 'inclusionai/ling-3.0-flash-free',
              messages: [{ role: 'user', content: 'Responda somente com STREAM_OK.' }],
            }),
          });
          const streamText = await streamResponse.text();
          if (!streamResponse.ok || !streamText.includes('data: [DONE]') || streamText.includes('"error"')) {
            throw new Error(`Streaming failed: HTTP ${streamResponse.status} ${streamText.slice(0, 500)}`);
          }
          console.log('stream: completed without error');

          const generated = await jsonRequest('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: 'Minimal flat icon: one solid blue circle centered on a plain white background, no text, clean vector-like edges.',
              width: 512,
              height: 512,
            }),
          });
          if (generated?.provider !== 'gateway' || generated?.gatewayAuth !== 'oidc' || typeof generated?.imageUrl !== 'string' || !generated.imageUrl.startsWith('data:image/')) {
            throw new Error(`Image generation did not use OIDC Gateway: ${JSON.stringify({ provider: generated?.provider, gatewayAuth: generated?.gatewayAuth, model: generated?.model, fallbackUsed: generated?.fallbackUsed, fallbackReason: generated?.fallbackReason })}`);
          }
          console.log(`image generation: provider=gateway auth=oidc model=${generated.model} bytes≈${Math.round(generated.imageUrl.length * 0.75)}`);

          const edited = await jsonRequest('/api/edit-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: generated.imageUrl,
              prompt: 'Change only the blue circle to green. Keep the white background and composition unchanged.',
            }),
          });
          if (edited?.provider !== 'gateway' || edited?.gatewayAuth !== 'oidc' || typeof edited?.imageUrl !== 'string' || !edited.imageUrl.startsWith('data:image/')) {
            throw new Error(`Image editing did not use OIDC Gateway: ${JSON.stringify({ provider: edited?.provider, gatewayAuth: edited?.gatewayAuth, model: edited?.model, fallbackUsed: edited?.fallbackUsed, fallbackReason: edited?.fallbackReason })}`);
          }
          console.log(`image editing: provider=gateway auth=oidc model=${edited.model} bytes≈${Math.round(edited.imageUrl.length * 0.75)}`);

          console.log('ORBIDOC_PRODUCTION_AI_SMOKE_OK');
          NODE
