name: OrbiDoc CI

on:
  push:
    branches: [main, "fix/**", "rebrand/orbidoc-final-2026-08-19"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbidoc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final OrbiDoc cleanup
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/rebrand/orbidoc-final-2026-08-19' && hashFiles('scripts/finalize-orbidoc.mjs') != '' }}
        run: node scripts/finalize-orbidoc.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: OrbiDoc brand audit
        run: node scripts/check-orbidoc-brand.mjs

      - name: Lint source syntax
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Verify PWA WebAPK and TWA prerequisites
        run: bun run verify:pwa

      - name: Commit validated final cleanup
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/rebrand/orbidoc-final-2026-08-19' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final cleanup changes to commit."
            exit 0
          fi
          git commit -m "Finalize OrbiDoc branding and AI availability"
          git push origin HEAD:rebrand/orbidoc-final-2026-08-19
