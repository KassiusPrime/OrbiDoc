name: DocSwiss CI

on:
  push:
    branches: [main, "fix/**", "rebrand/orbidoc-final-2026-08-19"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docswiss-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply OrbiDoc rebrand when migration script is present
        if: ${{ hashFiles('scripts/rebrand-orbidoc.mjs') != '' }}
        run: node scripts/rebrand-orbidoc.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint source syntax
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Verify PWA WebAPK and TWA prerequisites
        run: bun run verify:pwa

      - name: Commit validated OrbiDoc rebrand result
        if: ${{ hashFiles('scripts/rebrand-orbidoc.mjs') == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rebrand changes to commit."
            exit 0
          fi
          git commit -m "Rebrand DocSwiss to OrbiDoc"
          git push origin HEAD:rebrand/orbidoc-final-2026-08-19
