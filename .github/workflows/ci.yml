name: OrbiDoc CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbidoc-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: OrbiDoc brand audit
        run: node scripts/check-orbidoc-brand.mjs

      - name: Lint source syntax
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Verify PWA WebAPK and TWA prerequisites
        run: bun run verify:pwa
