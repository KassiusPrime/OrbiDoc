name: Finalize editor compatibility

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
    paths: [".github/workflows/finalize-editor-compat.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Wire Lexical find-replace plugin and formula precedence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/DocumentEditorLexical.tsx')
          text = path.read_text()
          import_anchor = "import { OFFICE_FONTS } from '../lib/officeStudio';"
          plugin_import = "import { LexicalFindReplacePlugin } from './LexicalFindReplacePlugin';"
          if plugin_import not in text:
              if import_anchor not in text:
                  raise SystemExit('Lexical editor import anchor not found')
              text = text.replace(import_anchor, import_anchor + '\n' + plugin_import, 1)
          plugin_anchor = "        <HorizontalRulePlugin />\n"
          if '<LexicalFindReplacePlugin />' not in text:
              if plugin_anchor not in text:
                  raise SystemExit('Lexical plugin anchor not found')
              text = text.replace(plugin_anchor, plugin_anchor + "        <LexicalFindReplacePlugin />\n", 1)
          path.write_text(text)

          path = Path('src/lib/fortuneSpreadsheet.ts')
          text = path.read_text()
          old = """export function normalizePtBrFormula(formula: string) {\n  if (!formula || !formula.startsWith('=')) return formula;\n  return PT_FORMULA_ALIASES.reduce((source, [pattern, replacement]) => source.replace(pattern, replacement), formula);\n}"""
          new = """export function normalizePtBrFormula(formula: string) {\n  if (!formula || !formula.startsWith('=')) return formula;\n  const orderedAliases = [...PT_FORMULA_ALIASES].sort(([left], [right]) => right.source.length - left.source.length);\n  return orderedAliases.reduce((source, [pattern, replacement]) => source.replace(pattern, replacement), formula);\n}"""
          if old not in text:
              raise SystemExit('formula normalizer anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit and self-remove
        run: |
          rm .github/workflows/finalize-editor-compat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(editors): preserve find-replace and formula alias precedence"
          git pull --rebase origin feat/offline-first-productivity-suite
          git push origin HEAD:feat/offline-first-productivity-suite
