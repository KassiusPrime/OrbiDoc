name: Finalize offline suite wiring

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
    paths: [".github/workflows/finalize-offline-wiring.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply idempotent AppV5 and launchQueue routing
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/AppV5.tsx')
          text = app.read_text()
          old_import = "import { PdfOcrWorkspace } from './components/PdfOcrWorkspace';"
          new_import = "import { PdfProductivityWorkspace } from './components/PdfProductivityWorkspace';"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('PDF AppV5 import anchor not found')
          old = """      return (\n        <PdfOcrWorkspace\n          items={ocrItems}"""
          new = """      return (\n        <PdfProductivityWorkspace\n          project={project}\n          onProjectChange={persistProject}\n          items={ocrItems}"""
          if old in text:
              text = text.replace(old, new, 1)
          elif '<PdfProductivityWorkspace' not in text:
              raise SystemExit('PDF AppV5 render anchor not found')
          app.write_text(text)

          system = Path('src/components/SystemFileOpenAgent.tsx')
          text = system.read_text()
          anchor = "import { OrbiDocLogo } from './OrbiDocLogo';"
          professional_import = "import { dispatchProfessionalFile, isProfessionalOfficeFile } from './ProfessionalFileRouterAgent';"
          if professional_import not in text:
              if anchor not in text:
                  raise SystemExit('System file import anchor not found')
              text = text.replace(anchor, anchor + '\n' + professional_import, 1)
          old = """  const loadFile = async (file: File) => {\n    setError('');\n    replaceDocument(await readDocumentFile(file));\n  };"""
          new = """  const loadFile = async (file: File) => {\n    setError('');\n    if (isProfessionalOfficeFile(file)) {\n      replaceDocument(null);\n      dispatchProfessionalFile(file);\n      return;\n    }\n    replaceDocument(await readDocumentFile(file));\n  };"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'dispatchProfessionalFile(file);' not in text:
              raise SystemExit('System file loadFile anchor not found')
          system.write_text(text)
          PY
      - name: Remove one-shot workflows and publish atomically
        run: |
          rm -f .github/workflows/wire-pdf-studio.yml
          rm -f .github/workflows/wire-system-file-router.yml
          rm -f .github/workflows/finalize-offline-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(core): finalize professional file and PDF routing"
          git pull --rebase origin feat/offline-first-productivity-suite
          git push origin HEAD:feat/offline-first-productivity-suite
