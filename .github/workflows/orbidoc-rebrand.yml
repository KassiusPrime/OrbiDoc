name: OrbiDoc Rebrand

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply OrbiDoc rebrand
        run: node scripts/rebrand-orbidoc.mjs

      - name: Refresh lockfile after package rename
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Production build
        run: bun run build

      - name: Verify PWA WebAPK and TWA prerequisites
        run: bun run verify:pwa

      - name: Commit validated rebrand to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rebrand changes to commit."
            exit 0
          fi
          git commit -m "Rebrand DocSwiss to OrbiDoc"
          git push origin HEAD:main

# Triggered intentionally after the serverless hotfix was validated in production.
