name: OrbiDoc Direct AI Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate direct AI providers in production
        env:
          BASE_URL: https://doc-swiss.vercel.app
        run: |
          node <<'NODE'
          const base = process.env.BASE_URL;

          async function jsonRequest(path, init = {}) {
            const response = await fetch(`${base}${path}`, init);
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`${path} returned non-JSON HTTP ${response.status}: ${text.slice(0, 180)}`); }
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}: ${JSON.stringify(data).slice(0, 500)}`);
            return data;
          }

          const health = await jsonRequest('/api/health');
          for (const provider of ['gemini', 'groq', 'openrouter']) {
            if (health?.ai?.[provider] !== true) throw new Error(`${provider} not enabled in health`);
          }
          console.log('health: Gemini + Groq + OpenRouter enabled');

          const status = await jsonRequest('/api/ai/status');
          for (const provider of ['gemini', 'groq', 'openrouter']) {
            const p = status?.providers?.[provider];
            if (!p?.configured || !p?.reachable || p?.status !== 200) {
              throw new Error(`${provider} probe failed: ${JSON.stringify(p)}`);
            }
          }
          console.log('provider probes: all HTTP 200');

          const cases = [
            ['gemini', 'gemini-3.6-flash', 'GEMINI_OK'],
            ['groq', 'openai/gpt-oss-120b', 'GROQ_OK'],
            ['openrouter', 'openrouter/auto', 'OPENROUTER_OK'],
          ];

          for (const [provider, model, marker] of cases) {
            const result = await jsonRequest('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                provider,
                model,
                messages: [{ role: 'user', content: `Responda somente com ${marker}.` }],
              }),
            });
            if (result?.provider !== provider || typeof result?.answer !== 'string' || !result.answer.trim()) {
              throw new Error(`${provider} generation failed: ${JSON.stringify({ provider: result?.provider, model: result?.model, fallbackUsed: result?.fallbackUsed, fallbackReason: result?.fallbackReason })}`);
            }
            console.log(`${provider}: provider=${result.provider} model=${result.model} fallback=${Boolean(result.fallbackUsed)}`);
          }

          const streamResponse = await fetch(`${base}/api/chat/stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              provider: 'gemini',
              model: 'gemini-3.6-flash',
              messages: [{ role: 'user', content: 'Responda somente com STREAM_OK.' }],
            }),
          });
          const streamText = await streamResponse.text();
          if (!streamResponse.ok || !streamText.includes('data: [DONE]') || streamText.includes('"error"')) {
            throw new Error(`Gemini streaming failed: HTTP ${streamResponse.status} ${streamText.slice(0, 500)}`);
          }
          console.log('stream: Gemini completed without error');

          const generated = await jsonRequest('/api/generate-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: 'Minimal flat icon: a single blue circle centered on a white background, no text.',
              width: 512,
              height: 512,
            }),
          });
          if (generated?.provider !== 'gemini' || typeof generated?.imageUrl !== 'string' || !generated.imageUrl.startsWith('data:image/')) {
            throw new Error(`Gemini image generation failed: ${JSON.stringify({ provider: generated?.provider, model: generated?.model, fallbackUsed: generated?.fallbackUsed, fallbackReason: generated?.fallbackReason })}`);
          }
          console.log(`image generation: provider=${generated.provider} model=${generated.model} fallback=${Boolean(generated.fallbackUsed)}`);

          const edited = await jsonRequest('/api/edit-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: generated.imageUrl,
              prompt: 'Change only the blue circle to green; keep the white background unchanged.',
            }),
          });
          if (edited?.provider !== 'gemini' || typeof edited?.imageUrl !== 'string' || !edited.imageUrl.startsWith('data:image/')) {
            throw new Error(`Gemini image editing failed: ${JSON.stringify({ provider: edited?.provider, model: edited?.model, fallbackUsed: edited?.fallbackUsed, fallbackReason: edited?.fallbackReason })}`);
          }
          console.log(`image editing: provider=${edited.provider} model=${edited.model} fallback=${Boolean(edited.fallbackUsed)}`);
          console.log('ORBIDOC_DIRECT_AI_SMOKE_OK');
          NODE
