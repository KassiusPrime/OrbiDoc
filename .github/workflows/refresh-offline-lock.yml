name: Refresh offline suite lock

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
    paths:
      - package.json
      - .github/workflows/refresh-offline-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orbidoc-offline-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Bun lock for offline suite"
          git push
