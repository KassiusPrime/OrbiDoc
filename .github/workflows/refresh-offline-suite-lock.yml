name: Refresh offline suite bun lock

on:
  push:
    branches: [feat/offline-first-productivity-suite]
    paths: [package.json]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/offline-first-productivity-suite
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already current"
            exit 0
          fi
          git config user.name "OrbiDoc Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun lock for offline suite"
          git push origin HEAD:feat/offline-first-productivity-suite
