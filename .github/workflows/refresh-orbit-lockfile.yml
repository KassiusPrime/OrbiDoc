name: Refresh Orbit lockfile

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve dependencies and refresh bun.lock
        run: bun install
      - name: Verify Nexus static policy
        run: node scripts/verify-nexus-ai.mjs
      - name: Commit lockfile when dependency graph changed
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore: refresh bun lockfile for Orbit Nexus AI'
          git push origin "HEAD:${BRANCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-bun-lock-${{ github.sha }}
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
