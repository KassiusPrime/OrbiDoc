name: Upgrade offline cache policy

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
    paths: [".github/workflows/upgrade-offline-cache.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Apply explicit Workbox offline-first strategies
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('vite.config.ts')
          text = path.read_text()
          old = '        globPatterns: ["**/*.{js,css,html,ico,png,svg,woff,woff2,mjs}"],\n        runtimeCaching: [\n'
          new = '''        globPatterns: ["**/*.{js,mjs,css,html,json,ico,png,jpg,jpeg,webp,svg,woff,woff2}"],\n        runtimeCaching: [\n          {\n            urlPattern: /\\.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|webp|svg|ico)$/i,\n            handler: "CacheFirst",\n            options: {\n              cacheName: "orbidoc-static-runtime",\n              expiration: { maxEntries: 180, maxAgeSeconds: 60 * 60 * 24 * 90 },\n              cacheableResponse: { statuses: [0, 200] },\n            },\n          },\n          {\n            urlPattern: ({ request }) => request.mode === "navigate",\n            handler: "StaleWhileRevalidate",\n            options: {\n              cacheName: "orbidoc-navigation",\n              expiration: { maxEntries: 30, maxAgeSeconds: 60 * 60 * 24 * 7 },\n              cacheableResponse: { statuses: [0, 200] },\n            },\n          },\n'''
          if old not in text:
              raise SystemExit('Workbox cache anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit and self-remove
        run: |
          rm .github/workflows/upgrade-offline-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(pwa): enforce offline-first editor caching"
          git pull --rebase origin feat/offline-first-productivity-suite
          git push origin HEAD:feat/offline-first-productivity-suite
