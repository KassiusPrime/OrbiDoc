name: Validate offline suite branch

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbidoc-offline-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run verify:pwa
