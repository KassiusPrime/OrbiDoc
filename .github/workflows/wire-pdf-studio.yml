name: Wire PDF Studio into AppV5

on:
  push:
    branches: ["feat/offline-first-productivity-suite"]
    paths: [".github/workflows/wire-pdf-studio.yml"]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Route PDF & OCR project to professional workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/AppV5.tsx')
          text = path.read_text()
          old_import = "import { PdfOcrWorkspace } from './components/PdfOcrWorkspace';"
          new_import = "import { PdfProductivityWorkspace } from './components/PdfProductivityWorkspace';"
          if old_import not in text:
              raise SystemExit('PdfOcrWorkspace import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old = """      return (\n        <PdfOcrWorkspace\n          items={ocrItems}"""
          new = """      return (\n        <PdfProductivityWorkspace\n          project={project}\n          onProjectChange={persistProject}\n          items={ocrItems}"""
          if old not in text:
              raise SystemExit('PDF workspace render anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit wiring and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/wire-pdf-studio.yml
          git add src/AppV5.tsx .github/workflows/wire-pdf-studio.yml
          git commit -m "feat(pdf): route PDF and OCR workspace to PDF Studio"
          git push
