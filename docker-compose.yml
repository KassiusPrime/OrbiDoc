name: orbidoc-selfhosted

networks:
  internal:

services:
  ollama:
    image: ollama/ollama:latest
    networks: [internal]
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # GPU NVIDIA (opcional): instale nvidia-container-toolkit e descomente:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    networks: [internal]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["sh", "-c", "ollama pull \"$$OLLAMA_MODEL\" && echo 'modelo pronto'"]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    networks: [internal]
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-CHANGE_ME_generate_with_openssl_rand_hex_32}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  app:
    build: .
    networks: [internal]
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      SEARXNG_URL: http://searxng:8080
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:
