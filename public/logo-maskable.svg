<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Blue Solid Canvas for Maskable Safe Zone -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#233d5d"/>
      <stop offset="50%" stop-color="#162c47"/>
      <stop offset="100%" stop-color="#102036"/>
    </linearGradient>

    <!-- Outer Hexagon Frame Gradient -->
    <linearGradient id="hexFrameMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a4a73"/>
      <stop offset="100%" stop-color="#1c3453"/>
    </linearGradient>

    <!-- Inner Hexagon Well -->
    <linearGradient id="hexWellMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101e33"/>
      <stop offset="100%" stop-color="#1a2e4a"/>
    </linearGradient>

    <!-- Green Page Fold Light Top -->
    <linearGradient id="greenTopMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52d673"/>
      <stop offset="100%" stop-color="#22b34a"/>
    </linearGradient>

    <!-- Green Page Fold Body -->
    <linearGradient id="greenBodyMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28b84e"/>
      <stop offset="50%" stop-color="#1e973d"/>
      <stop offset="100%" stop-color="#15722c"/>
    </linearGradient>

    <!-- Green Page Fold Swoosh Wing -->
    <linearGradient id="greenWingMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22ad48"/>
      <stop offset="100%" stop-color="#1a8335"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="hexShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#08101c" flood-opacity="0.6"/>
    </filter>

    <filter id="plusShadowMask" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#091424" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full 512x512 Background (covers full maskable safe area) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Scaled & Centered Emblem inside safe zone (scale ~0.8) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <g filter="url(#hexShadowMask)">
      <!-- Hexagon Outer Beveled Ring -->
      <path d="M 256 80 
               L 380 151.6 
               Q 396 160.8 396 179.3 
               L 396 322.7 
               Q 396 341.2 380 350.4 
               L 256 422 
               Q 240 431.2 224 422 
               L 100 350.4 
               Q 84 341.2 84 322.7 
               L 84 179.3 
               Q 84 160.8 100 151.6 
               L 224 80 
               Q 240 70.8 256 80 Z" 
            fill="url(#hexFrameMask)" 
            stroke="#385e8e" 
            stroke-width="3"/>

      <!-- Hexagon Inner Depressed Well -->
      <path d="M 256 108 
               L 358 166.9 
               Q 370 173.8 370 187.7 
               L 370 295.3 
               Q 370 309.2 358 316.1 
               L 256 375 
               Q 244 381.9 232 375 
               L 130 316.1 
               Q 118 309.2 118 295.3 
               L 118 187.7 
               Q 118 173.8 130 166.9 
               L 232 108 
               Q 244 101.1 256 108 Z" 
            fill="url(#hexWellMask)" 
            stroke="#0d1829" 
            stroke-width="6"/>

      <!-- Green Folded Document / Leaf Ribbon -->
      <path d="M 224 165 C 215 125, 232 120, 240 128 L 225 205 Z" fill="url(#greenTopMask)"/>
      <path d="M 170 220 L 240 128 C 248 138, 258 190, 225 285 C 205 338, 162 292, 170 220 Z" fill="url(#greenBodyMask)"/>
      <path d="M 170 220 C 155 320, 230 360, 260 360 C 330 360, 396 270, 396 270 C 396 270, 328 335, 258 328 C 202 322, 182 270, 170 220 Z" fill="url(#greenWingMask)"/>

      <!-- White Plus Cross (+) Icon -->
      <g transform="translate(268, 148)" filter="url(#plusShadowMask)">
        <rect x="28" y="0" width="24" height="72" rx="6" fill="#ffffff"/>
        <rect x="4" y="24" width="72" height="24" rx="6" fill="#ffffff"/>
      </g>
    </g>
  </g>
</svg>
