use_default_settings: true

server:
  # Gere um segredo real com: openssl rand -hex 32
  # Substitua CHANGE_ME antes de uma instalação exposta.
  secret_key: "CHANGE_ME_gerar_com_openssl_rand_hex_32"
  limiter: false
  image_proxy: true
  method: "GET"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

ui:
  static_use_hash: true
